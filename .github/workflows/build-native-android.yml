name: Build Native Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager "ndk;25.1.8937393"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Cache cargo registry and build cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust

    - name: Build Native Rust Library
      run: bash ./tools/build-rust-android.sh

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
    - name: Build Android APK
      run: ./gradlew assembleDebug


    - name: Stale Binary Protection
      run: |
        # If the generated binaries differ from the checked-in binaries, it means the developer
        # changed the Rust source but forgot to check in the newly compiled .so files.
        # We fail the build HERE after proving the pipeline works, so they don't merge stale bins.
        if ! git diff --exit-code app/src/main/jniLibs/; then
          echo "ERROR: Checked-in native binaries (libadblock_rust.so) are stale!"
          echo "Please run ./tools/build-rust-android.sh locally and commit the fresh binaries."
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          echo "Trying to commit new binaries..."
          git add app/src/main/jniLibs/
          git commit -m "Auto-update stale native binaries"
          git push
        fi


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
